[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddi-gnn"
version = "0.1.0"
description = "Drug-drug interaction prediction with a GraphSAGE model on ogbl-ddi."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "networkx",
    "ogb",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "jupyter"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]